name: Juxta Labs
description: 'Juxta Labs, Inc. was a San Francisco social and mobile applications
  startup founded around 2011 by Jared Allgood and Jayson Ahlstrom, building social
  games and light-social apps for teens (titles such as Zoomed In, Shadow Shapes, and
  Pick the Song) that reportedly reached tens of millions of users. In June 2015 the
  company raised roughly $1.7M from investors including 500 Global (then 500 Startups),
  Monashees, Alta Ventures, and Atua Ventures, which is why it surfaces in the 500 Global
  portfolio. The company is now inactive/deadpooled and its site (juxtalabs.com) is
  offline, so there is no live developer portal, documentation, or API surface to enrich.
  Note: an unrelated current company at juxtalabs.io (enterprise AI document automation)
  is a different entity and is not this 500 Global portfolio company.'
